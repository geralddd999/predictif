<!DOCTYPE html>
<html>
    <head>
        <title>Start Page</title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    </head>
    
    <body>
        
        <h1>Hello World!</h1>
        
        <div>
            <button id = "dmd-btn">
                View Demands
            </button>
        </div>
        
        <script>
            const BASE_URL = 'http://localhost:8080/td2';
            
            function initPage(){
                document.getElementById('dmd-btn').addEventListener('click', function() {
                    console.log("Click sur le bouton 'View Demands'");
                    window.location.href = BASE_URL + "/demandes.html";
                });
            }
            
            window.onload = initPage;
        </script>
    </body>
</html>
